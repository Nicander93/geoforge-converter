name: Release Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache vcpkg installed
        uses: actions/cache@v4
        id: cache-vcpkg
        with:
          path: ${{ github.workspace }}/vcpkg_installed/
          key: win-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: win-vcpkg-

      - name: Setup vcpkg (checkout only)
        uses: lukka/run-vcpkg@v11
        with:
          doNotCache: true
          vcpkgGitCommitId: "84bab45d415d22042bd0b9081aea57f362da3f35"
          runVcpkgInstall: false
        env:
          VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
          VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
          VCPKG_DEFAULT_TRIPLET: x64-windows

      - name: Install vcpkg ports (retry)
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:VCPKG_DEFAULT_TRIPLET = "x64-windows"
          $env:VCPKG_BINARY_SOURCES = "clear;x-gha,readwrite"
          $ok = $false
          for ($i = 1; $i -le 4; $i++) {
            Write-Host "=== vcpkg install attempt $i ==="
            & "$env:VCPKG_ROOT\vcpkg.exe" install --recurse --clean-after-build --x-install-root "$env:GITHUB_WORKSPACE\vcpkg_installed"
            if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            Write-Warning "vcpkg install failed (exit $LASTEXITCODE); sleeping before retry"
            Start-Sleep -Seconds (30 * $i)
          }
          if (-not $ok) { exit 1 }

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release
        env:
          VCPKG_HAS_BEEN_INSTALLED: "1"

      - name: Package converter runtime
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0-ci' }
          powershell -File scripts/package-windows.ps1 -OutDir dist/converter -Version $ver
          $zip = "geoforge-converter-$ver-windows-x64.zip"
          Compress-Archive -Path dist/converter/* -DestinationPath $zip -Force
          Get-FileHash $zip -Algorithm SHA256 | Format-List
          (Get-FileHash $zip -Algorithm SHA256).Hash | Out-File -Encoding ascii "$zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            geoforge-converter-*-windows-x64.zip
            geoforge-converter-*-windows-x64.zip.sha256

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            geoforge-converter-*-windows-x64.zip
            geoforge-converter-*-windows-x64.zip.sha256
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
